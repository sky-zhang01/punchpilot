name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 26.13.0
  BUILDX_VERSION: v0.38.2
  BUILDKIT_IMAGE: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

jobs:
  docker-build:
    name: Docker Build Check (amd64)
    runs-on: ubuntu-26.04
    # Every public candidate validates the primary x86 deployment target.
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build amd64 (dry run)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: punchpilot-ci:amd64
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
          pull: true
          no-cache-filters: runtime
      - name: Verify container privilege drop
        run: |
          runtime_uid=$(docker run --rm punchpilot-ci:amd64 id -u)
          test "$runtime_uid" != "0"
          if docker run --rm -e PUID=0 punchpilot-ci:amd64 id -u; then
            echo "Container accepted an unsafe root PUID." >&2
            exit 1
          fi
      - name: Install reviewed Node.js
        run: bash scripts/ci/install-reviewed-node.sh
      - name: Install pinned Trivy
        run: bash scripts/ci/install-trivy.sh
      - name: Scan built amd64 image
        run: bash scripts/ci/container-image-security-gate.sh punchpilot-ci:amd64 trivy-image-amd64.json linux/amd64

  security-scan:
    name: Security Scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Trivy
        run: bash scripts/ci/install-trivy.sh
      - name: Filesystem, dependency, secret, and configuration scan
        run: bash scripts/ci/filesystem-security-gate.sh
