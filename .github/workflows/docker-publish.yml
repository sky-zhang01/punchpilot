name: Publish Docker Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build-and-push:
    name: Build & Push (Multi-Arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Public release privacy gate
        env:
          PUBLIC_RELEASE_FORBIDDEN_HOSTS: ${{ secrets.PUBLIC_RELEASE_FORBIDDEN_HOSTS }}
        run: python3 scripts/ci/public-release-privacy-gate.py --root . --repo-name "$GITHUB_REPOSITORY" --require-forbidden-hosts

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for the current version from CHANGELOG.md
          # Matches from "## [x.y.z]" to the next "## [" or end of file
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          # Write to file for gh release (avoids quoting issues)
          echo "$NOTES" > /tmp/release-notes.md

          # Append platform info
          cat >> /tmp/release-notes.md << 'EOF'

          ---

          ## Docker Image

          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          ```

          ### Supported Platforms

          | Architecture | Platform | Example Hardware |
          |---|---|---|
          | `linux/amd64` | x86_64 | Intel/AMD servers, PCs, most cloud VMs |
          | `linux/arm64` | aarch64 | Apple M-series, AWS Graviton, Raspberry Pi 4+ |

          > Windows and macOS users run the same image through Docker Desktop (Linux VM).
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "PunchPilot $GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
