name: Branch Housekeeping

on:
  schedule:
    - cron: '20 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0

jobs:
  dry-run:
    name: Merged Branch Dry Run
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install reviewed Node.js
        run: bash scripts/ci/install-reviewed-node.sh

      - name: Report merged branch cleanup candidates
        run: node scripts/ci/branch-housekeeping.mjs --fetch --remote origin
