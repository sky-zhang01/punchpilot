version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    cooldown:
      semver-major-days: 14
      semver-minor-days: 3
    ignore:
      # Keep Node type definitions aligned with the Node 24 runtime used by CI and Docker.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      production-patch-updates:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
      production-minor-updates:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
      development-patch-updates:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
      development-minor-updates:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: daily
      time: "06:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    cooldown:
      semver-major-days: 14
      semver-minor-days: 3
    ignore:
      # Keep Node type definitions aligned with the Node 24 runtime used by CI and Docker.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      production-patch-updates:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
      production-minor-updates:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
      development-patch-updates:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
      development-minor-updates:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
