version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 6
    versioning-strategy: increase
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # Keep Node type definitions aligned with the Node 24 runtime used by CI and Docker.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      production-patch-updates:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
        exclude-patterns:
          - playwright
          - better-sqlite3
          - express
      production-minor-updates:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
        exclude-patterns:
          - playwright
          - better-sqlite3
          - express
      vitest-toolchain:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - vitest
          - "@vitest/coverage-v8"
        update-types:
          - patch
          - minor
      eslint-toolchain:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - eslint
          - eslint-plugin-security
        update-types:
          - patch
          - minor
      development-patch-updates:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
        exclude-patterns:
          - vitest
          - "@vitest/coverage-v8"
          - eslint
          - eslint-plugin-security
      development-minor-updates:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
        exclude-patterns:
          - vitest
          - "@vitest/coverage-v8"
          - eslint
          - eslint-plugin-security

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: daily
      time: "06:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 6
    versioning-strategy: increase
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # Keep Node type definitions aligned with the Node 24 runtime used by CI and Docker.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      production-patch-updates:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
        exclude-patterns:
          - react-router
      production-minor-updates:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
        exclude-patterns:
          - react-router
      vitest-toolchain:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - vitest
          - "@vitest/coverage-v8"
        update-types:
          - patch
          - minor
      vite-toolchain:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - vite
          - "@vitejs/plugin-react"
        update-types:
          - patch
          - minor
      development-patch-updates:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
        exclude-patterns:
          - vitest
          - "@vitest/coverage-v8"
          - vite
          - "@vitejs/plugin-react"
          - typescript
      development-minor-updates:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
        exclude-patterns:
          - vitest
          - "@vitest/coverage-v8"
          - vite
          - "@vitejs/plugin-react"
          - typescript

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "07:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "07:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
